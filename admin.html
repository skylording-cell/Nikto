<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><title>Админ-панель — Big Happy House</title><link rel="stylesheet" href="admin.css"></head><body><header class="bar"><a href="index.html" class="brand">🏡 Big Happy House</a><span>Панель владельца</span></header><main class="wrap"><section id="loginPanel" class="panel auth"><div class="eyebrow">ТОЛЬКО ДЛЯ ВЛАДЕЛЬЦА</div><h1>Управление заказами</h1><p>Войдите с учётной записью, которую добавили в список разрешённых администраторов.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Войти</button><p id="loginError" class="error" role="alert"></p></form></section><section id="dashboard" hidden><div class="heading"><div><div class="eyebrow">BIG HAPPY HOUSE</div><h1>Заказы</h1></div><button id="logout" class="btn secondary">Выйти</button></div><div id="stats" class="stats"></div><div class="toolbar"><input id="search" class="field" placeholder="Номер, никнейм или телефон" aria-label="Поиск заказа"><select id="statusFilter" class="field" aria-label="Фильтр статуса"><option value="">Все статусы</option><option>Новый</option><option>Принят</option><option>В работе</option><option>Выполнен</option><option>Отменён</option></select><select id="sortOrder" class="field" aria-label="Сортировка"><option value="desc">Сначала новые</option><option value="asc">Сначала старые</option></select><button id="refresh" class="btn secondary">Обновить</button></div><p id="notice" role="status" class="notice"></p><div id="orders" class="orders"><p class="muted">Загрузка…</p></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
