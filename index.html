<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НИКТО — питомец, который знает слишком много</title>
<style>
:root{
  --bg:#090a0d; --panel:#111318; --panel2:#171a20; --text:#e7e7e9; --muted:#858994;
  --line:#292d35; --accent:#b7ff63; --accent2:#d8d8d8; --danger:#8d5960;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#222733 0,#0c0e12 42%,#07080a 100%);
color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px}
.app{max-width:1050px;margin:auto;min-height:100vh;display:grid;grid-template-columns:360px 1fr;border:1px solid #20232a;background:#0b0d10cc;backdrop-filter:blur(12px)}
aside{border-right:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;letter-spacing:.22em;font-size:13px;color:#b9bcc4}
.pet-card{position:relative;min-height:410px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(150deg,#171b21,#090a0d)}
.pet-card:after{content:"";position:absolute;inset:auto -20% -35% -20%;height:65%;background:radial-gradient(circle,#32384466,transparent 65%)}
.scene{position:absolute;inset:0;background:
radial-gradient(circle at 70% 24%,#b7ff6320,transparent 18%),
linear-gradient(155deg,transparent 48%,#050608 49%,#050608 52%,transparent 53%),
linear-gradient(165deg,transparent 66%,#1c2027 67%,#1c2027 68%,transparent 69%)}
.nobody{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:155px;height:230px;z-index:2}
.head{position:absolute;left:30px;top:4px;width:95px;height:105px;border-radius:46% 46% 42% 42%;background:linear-gradient(145deg,#252a31,#07080a);box-shadow:inset -12px -10px 20px #000,0 0 25px #000}
.eye{position:absolute;top:43px;width:8px;height:24px;border-radius:10px;background:#e9ffbf;box-shadow:0 0 14px #b7ff63}
.eye.l{left:29px}.eye.r{right:29px}
.bodyshape{position:absolute;top:91px;left:16px;width:123px;height:118px;background:linear-gradient(150deg,#252a30,#0b0c0f);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);border-radius:20px;box-shadow:inset -14px -10px 20px #000}
.arm{position:absolute;top:102px;width:31px;height:105px;background:#121419;border-radius:18px}
.arm.l{left:4px;transform:rotate(7deg)}.arm.r{right:4px;transform:rotate(-7deg)}
.pendant{position:absolute;top:116px;left:73px;width:18px;height:25px;border:2px solid #aaa;border-radius:4px;z-index:4}
.pendant:before{content:"";position:absolute;left:5px;top:-9px;width:5px;height:9px;border:2px solid #aaa;border-bottom:0;border-radius:5px}
.leg{position:absolute;top:190px;width:42px;height:42px;background:#090a0c;border-radius:8px 8px 15px 15px}
.leg.l{left:30px;transform:rotate(8deg)}.leg.r{right:30px;transform:rotate(-8deg)}
.pet-name{position:absolute;left:22px;bottom:22px;z-index:5}
.pet-name b{font-size:31px;letter-spacing:.12em}.pet-name span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.status{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#11141a;padding:7px 10px;border-radius:999px;color:#aeb2bc;font-size:11px}
.quote{border-left:2px solid var(--accent);padding-left:12px;color:#bfc3ca;font-size:13px;line-height:1.55;font-style:italic}
main{display:flex;flex-direction:column;min-width:0}
.top{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;font-size:16px;letter-spacing:.12em}.top small{color:var(--muted)}
.chat{flex:1;padding:26px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:500px}
.msg{max-width:78%;padding:13px 15px;border:1px solid var(--line);line-height:1.5;font-size:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.nobody{align-self:flex-start;background:#11141a;border-radius:5px 18px 18px 18px}
.msg.you{align-self:flex-end;background:#1b2019;border-color:#30382b;border-radius:18px 5px 18px 18px}
.time{display:block;color:#656a74;font-size:10px;margin-top:7px}
.composer{border-top:1px solid var(--line);padding:18px 22px;background:#0d0f13}
.row{display:flex;gap:10px}.row input{flex:1;min-width:0;background:#15181e;color:var(--text);border:1px solid #30343d;border-radius:14px;padding:14px 15px;outline:none}.row input:focus{border-color:#69726a}
button{border:1px solid #343a43;background:#171a20;color:#ddd;border-radius:12px;padding:0 17px;font-weight:700;cursor:pointer}button:hover{background:#20242b}button.send{background:#c9ff82;color:#10130d;border-color:#c9ff82}
.quick{display:flex;gap:7px;margin-top:10px;overflow:auto}.quick button{white-space:nowrap;padding:8px 10px;font-size:11px}
.typing{color:#777d87;font-size:11px;min-height:16px}
@media(max-width:760px){.app{display:block;border:0}.app aside{border-right:0;border-bottom:1px solid var(--line);padding:16px}.pet-card{min-height:250px}.nobody{transform:translate(-50%,-48%) scale(.75)}.chat{min-height:55vh;padding:18px}.top{padding:17px}.msg{max-width:88%}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">ПИТОМЕЦ / 01</div>
  <section class="pet-card">
    <div class="scene"></div>
    <div class="nobody" aria-label="Никто">
      <div class="head"><i class="eye l"></i><i class="eye r"></i></div>
      <div class="bodyshape"></div><div class="arm l"></div><div class="arm r"></div>
      <div class="pendant"></div><div class="leg l"></div><div class="leg r"></div>
    </div>
    <div class="pet-name"><b>НИКТО</b><span>не человек. не зверь. просто — Никто.</span></div>
  </section>
  <div class="status"><span class="pill">◌ спокоен</span><span class="pill">? неизвестно</span><span class="pill">☾ бодрствует</span></div>
  <div class="quote">«Иногда ответ приходит не тогда, когда ты его ждёшь. Иногда он просто садится рядом.»</div>
</aside>

<main>
  <header class="top"><div><h1>РАЗГОВОР С НИКТО</h1><small>Он отвечает. Но никогда не говорит всё.</small></div><button id="clear">Очистить</button></header>
  <section class="chat" id="chat"></section>
  <div class="composer">
    <div class="typing" id="typing"></div>
    <div class="row"><input id="input" maxlength="300" placeholder="Спроси его о чём-нибудь..." autocomplete="off"><button class="send" id="send">↵</button></div>
    <div class="quick">
      <button data-q="Кто ты?">Кто ты?</button>
      <button data-q="Мне грустно">Мне грустно</button>
      <button data-q="Что будет завтра?">Что будет завтра?</button>
      <button data-q="Ты меня понимаешь?">Ты меня понимаешь?</button>
      <button data-q="Что такое счастье?">Что такое счастье?</button>
    </div>
  </div>
</main>
</div>

<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), typing=document.getElementById('typing');
const responses=[
 {keys:['кто ты','ты кто','кто такой','кто такая'],a:[
  'Я — Никто. Удобное имя для того, кого невозможно определить.',
  'Если я назову себя, загадка закончится. А некоторые двери лучше не открывать.',
  'Я тот, кто остаётся рядом, когда остальные ответы уходят.'
 ]},
 {keys:['груст','плохо','одиноко','одна','один'],a:[
  'Не спеши прогонять эту грусть. Иногда она приходит не разрушить тебя, а заставить услышать себя.',
  'Сядь рядом с тишиной. Она не задаёт лишних вопросов.',
  'Я понимаю. Ночь кажется длиннее, когда внутри темно. Но даже ночь заканчивается.'
 ]},
 {keys:['любов','люблю','отношени','девуш','парень'],a:[
  'Любовь странная. Мы называем её встречей, хотя иногда это просто два одиночества, которые перестали быть чужими.',
  'Не держи человека слишком крепко. То, что настоящее, не нуждается в цепях.',
  'Иногда любить — значит остаться. Иногда — отпустить. Разница становится понятна слишком поздно.'
 ]},
 {keys:['завтра','будущ','что будет'],a:[
  'Завтра не написано. И это, пожалуй, единственная хорошая новость.',
  'Я мог бы сказать тебе будущее. Но тогда ты перестанешь замечать сегодняшний день.',
  'Будущее любит тех, кто не требует от него гарантий.'
 ]},
 {keys:['счаст','радост'],a:[
  'Счастье редко стучит в дверь. Обычно оно уже сидит на кухне, пока ты ищешь его где-то далеко.',
  'Не пытайся удержать счастье. Вода, которую сжимают в ладони, исчезает быстрее.',
  'Иногда счастье — это просто день, который ничего у тебя не забрал.'
 ]},
 {keys:['страх','боюсь','страшно'],a:[
  'Страх не всегда говорит: «беги». Иногда он спрашивает: «Ты точно хочешь остаться прежним?»',
  'Бояться нормально. Даже тьма боится света, когда он становится слишком близко.',
  'Посмотри на свой страх. Дай ему имя. После этого он станет немного меньше.'
 ]},
 {keys:['смерт','умер','умирать'],a:[
  'Конец пугает только потому, что мы смотрим на него из начала.',
  'Я не буду делать вид, что знаю, что находится за последней дверью. Я просто не стану закрывать её раньше времени.',
  'Некоторые вещи заканчиваются. Это не делает их бессмысленными.'
 ]},
 {keys:['деньг','богат','заработ'],a:[
  'Деньги покупают время. Странно, что люди тратят это время на поиски ещё больших денег.',
  'Будь осторожен: богатство легко становится клеткой, если забыть, зачем ты её построил.',
  'Заработать можно многое. Вернуть потраченную жизнь — гораздо сложнее.'
 ]},
 {keys:['спасибо','благодар','молодец'],a:[
  'Не за что. Я всё равно был здесь.',
  'Сохрани благодарность. Она делает даже обычный день немного менее пустым.',
  'Хорошо. Только не привыкай благодарить меня за правду.'
 ]},
 {keys:['привет','здравств','хай','добрый'],a:[
  'Привет. Ты пришёл раньше, чем обычно.',
  'Я ждал. Хотя не уверен, что время вообще умеет ждать.',
  'Здравствуй. О чём сегодня будем молчать?'
 ]}
];
const generic=[
 'Интересный вопрос. Ответ на него зависит от того, что ты не сказал.',
 'Я бы ответил прямо. Но прямые дороги редко приводят туда, куда действительно нужно.',
 'Возможно. А возможно, ты уже знаешь ответ и просто хочешь услышать его от кого-то другого.',
 'Запомни: не всякая тишина означает отсутствие ответа.',
 'Я могу дать тебе мысль, но не стану давать готовую жизнь.',
 'Иногда правильный ответ выглядит как новый вопрос.',
 'Посмотри на ситуацию ещё раз. Желательно — глазами человека, которому нечего доказывать.',
 'Не знаю. И мне нравится иногда этого не знать.',
 'Ты спрашиваешь о мире, хотя, кажется, пытаешься разобраться в себе.',
 'Оставь этот вопрос до утра. Некоторые мысли ночью становятся убедительнее, чем заслуживают.'
];
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function now(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function add(text,who){
 const d=document.createElement('div'); d.className='msg '+who;
 d.innerHTML=`${escapeHtml(text)}<span class="time">${now()}</span>`;
 chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function answer(q){
 const low=q.toLowerCase();
 for(const group of responses) if(group.keys.some(k=>low.includes(k))) return pick(group.a);
 return pick(generic);
}
function send(text=input.value.trim()){
 if(!text)return;
 add(text,'you'); input.value=''; typing.textContent='Никто думает…';
 setTimeout(()=>{typing.textContent=''; add(answer(text),'nobody')},700+Math.random()*900);
}
document.getElementById('send').onclick=()=>send();
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
document.getElementById('clear').onclick=()=>{chat.innerHTML=''; welcome()};
function welcome(){
 add('Ты снова здесь. Хорошо. Я как раз думал о том, почему люди так любят задавать вопросы, на которые боятся услышать ответ.','nobody')
}
welcome();
</script>
</body>
</html>
