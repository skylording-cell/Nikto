<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf0"><title>Отслеживание заказа — Big Happy House</title><link rel="stylesheet" href="admin.css"></head><body><header class="bar"><a href="index.html" class="brand">🏡 Big Happy House</a><a href="index.html">На главную ↗</a></header><main class="wrap"><section class="panel auth"><div class="eyebrow">ВАША РАДОСТЬ В ПУТИ</div><h1>Отследить заказ</h1><p>Введите номер заказа и персональный код отслеживания. Код есть только у вас — не отправляйте его посторонним.</p><form id="trackForm"><label for="publicId">Номер заказа</label><input id="publicId" class="field" placeholder="BHH-000001" maxlength="24" required><label for="trackingCode">Код отслеживания</label><input id="trackingCode" class="field" autocomplete="off" minlength="20" maxlength="100" required><button class="btn" id="trackButton" type="submit">Проверить статус</button><p id="trackError" class="error" role="alert"></p></form><div id="trackResult" hidden class="track-result"></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="track.js"></script></body></html>
